[package]
name = "agent-epub"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Focused EPUB generation for AI agents"
license = "MIT"
repository = "https://github.com/benvds/agent-epub"
documentation = "https://github.com/benvds/agent-epub/blob/v0.5.1/docs/USAGE.md"
readme = "README.md"
keywords = ["epub", "markdown", "cli", "agents"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
language-tags = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
percent-encoding = "2"
pulldown-cmark = "0.13"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
unicase = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
same-file = "1.0.6"
