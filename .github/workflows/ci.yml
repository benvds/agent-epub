name: EPUB checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy && rustup default 1.95.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install official EPUBCheck
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  $RUNNER_TEMP/epubcheck.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Independently validate supported fixtures
        env:
          EPUBCHECK: ./scripts/epubcheck.sh
        run: cargo test --locked --test cli independent_epubcheck_corpus -- --ignored
      - name: Independently validate cover publications
        env:
          EPUBCHECK: ./scripts/epubcheck.sh
        run: cargo test --locked --test covers independent_cover_corpus -- --ignored
