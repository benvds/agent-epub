name: EPUB checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy && rustup default 1.95.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install official EPUBCheck
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  $RUNNER_TEMP/epubcheck.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Independently validate supported fixtures
        env:
          EPUBCHECK: ./scripts/epubcheck.sh
        run: cargo test --locked --test cli independent_epubcheck_corpus -- --ignored
      - name: Independently validate cover publications
        env:
          EPUBCHECK: ./scripts/epubcheck.sh
        run: cargo test --locked --test covers independent_cover_corpus -- --ignored
      - name: Independently validate illustrated publications
        env:
          EPUBCHECK: ./scripts/epubcheck.sh
        run: cargo test --locked --test images independent_inline_image_corpus -- --ignored
      - name: Independently validate the committed showcase
        run: cargo run --locked -- validate examples/showcase.epub --epubcheck ./scripts/epubcheck.sh --json
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            executable: agent-epub
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: agent-epub
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: agent-epub.exe
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary, notices, instructions and checked sample
        run: python scripts/release.py pack --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  install:
    name: Clean install (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.target }}
          path: dist
      - name: Install archive and exercise CLI with no Rust or Java on PATH
        shell: bash
        run: python scripts/release.py smoke --archive dist/agent-epub-*-${{ matrix.target }}.zip --report dist/${{ matrix.target }}-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.target }}
          path: dist/*-smoke.json
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish checked release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: smoke-*
          merge-multiple: true
          path: dist
      - name: Verify release identity and native evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, tomllib
          from scripts.release import TARGETS
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          sums = []
          for target in TARGETS:
              archive = pathlib.Path(f'dist/agent-epub-{version}-{target}.zip')
              checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
              line = f'{checksum}  {archive.name}\n'
              assert archive.with_suffix('.zip.sha256').read_text() == line
              report = json.loads(pathlib.Path(f'dist/{target}-smoke.json').read_text())
              assert report['status'] == 'passed' and report['sha256'] == checksum
              assert report['archive'] == archive.name
              assert report['version'] == f'agent-epub {version}'
              sums.append(line)
          showcase = pathlib.Path(f'dist/agent-epub-showcase-{version}.epub')
          shutil.copyfile('examples/showcase.epub', showcase)
          sums.append(f'{hashlib.sha256(showcase.read_bytes()).hexdigest()}  {showcase.name}\n')
          pathlib.Path('dist/SHA256SUMS').write_text(''.join(sums))
          PY
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Agent EPUB $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md dist/*.zip dist/*.zip.sha256 dist/*.epub dist/*-smoke.json dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
